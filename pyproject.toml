[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "actiongraph"
version = "0.1.0"
description = "Turn meeting transcripts into evidence-linked decisions, action items, owners, deadlines and risks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Navyashree Byregowda" }]
keywords = ["llm", "meetings", "information-extraction", "action-items", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "dateparser>=1.2",
  "numpy>=1.26",
  "pypdf>=4.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["anthropic>=0.40", "openai>=1.40", "faster-whisper>=1.0"]

[project.scripts]
actiongraph = "actiongraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/actiongraph"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]  # E501: ruff format owns wrapping

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
